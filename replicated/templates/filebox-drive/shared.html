            #boot-progress {
                position: fixed;
                inset-block-start: 0;
                inset-inline: 0;
                z-index: 100;
                block-size: 2px;
                background-color: oklch(0.205 0 0);
                transform: scaleX(0);
                transform-origin: 0 50%;
                animation: boot-progress 6s linear forwards;
            }

            html.dark #boot-progress {
                background-color: oklch(0.922 0 0);
            }

            /* The ramp `CAP * (1 - e^(-t/TAU))` with TAU 1100ms and a 90%
               cap, sampled into keyframes. The shape is the point: it has to be
               READABLE in the first 200ms, which is all a fast load gets. */
            @keyframes boot-progress {
                0%    { transform: scaleX(0); }
                3.3%  { transform: scaleX(0.15); }   /* 200ms */
                8.3%  { transform: scaleX(0.33); }   /* 500ms */
                16.6% { transform: scaleX(0.54); }   /* 1s */
                33%   { transform: scaleX(0.77); }   /* 2s */
                100%  { transform: scaleX(0.90); }
            }

            @media (prefers-reduced-motion: reduce) {
                #boot-progress { animation: none; transform: scaleX(0.3); }
            }
        </style>
