name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.22.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build registry
        run: pnpm build:registry

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build demos
        run: |
          pnpm -C apps/react-demo build
          pnpm -C apps/vue-demo build

      - name: Build docs
        run: pnpm -C apps/docs docs:build

      - name: Demo smoke tests
        run: |
          pnpm -C apps/react-demo vitest run
          pnpm -C apps/vue-demo vitest run
